<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Pipeline - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/challenge/public/css/styles.css">
</head>
<body class="bg-slate-900 text-white font-mono min-h-screen overflow-hidden">
    <!-- Particle Background -->
    <div id="particles-container" class="fixed inset-0 z-0"></div>
    
    <!-- Header -->
<header class="relative z-10 bg-slate-800/90 backdrop-blur-sm border-b border-orange-500/20">
    <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-red-600 rounded-lg flex items-center justify-center">
                    <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <a href="/challenge/">
                        <h1 class="text-xl font-bold phoenix-font text-orange-400">
                                                            PHOENIX PIPELINE
                                                    </h1>
                        <p class="text-xs text-slate-400">Phoenix Pipeline Management</p>
                    </a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                                    <!-- Guest User Menu -->
                    <div class="flex items-center space-x-4">
                        <a href="/challenge/login" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white text-sm transition-all">
                            <i data-lucide="log-in" class="w-4 h-4 inline mr-2"></i>
                            Login
                        </a>
                        <a href="/challenge/register" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 rounded-lg text-white text-sm transition-all">
                            <i data-lucide="user-plus" class="w-4 h-4 inline mr-2"></i>
                            Register
                        </a>
                    </div>
                            </div>
        </div>
    </div>
</header>     
    <!-- Register Container -->
    <div class="relative z-10 min-h-screen flex items-center justify-center px-6">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-red-600 rounded-lg flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="user-plus" class="w-8 h-8 text-white"></i>
                </div>
                <h1 class="text-2xl font-bold phoenix-font text-orange-400 mb-2">OPERATOR REGISTRATION</h1>
                <p class="text-slate-400">Phoenix Pipeline Control Center</p>
            </div>

            <!-- Register Form -->
            <form id="register-form" class="bg-slate-800/50 backdrop-blur-sm p-8 rounded-lg border border-slate-700" method="post" action="/challenge/register">
                <div class="mb-6">
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-2">
                        <i data-lucide="user" class="w-4 h-4 inline mr-2"></i>
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent text-white placeholder-slate-400"
                        placeholder="Enter username"
                        autocomplete="username"
                    >
                </div>
                
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                        <i data-lucide="lock" class="w-4 h-4 inline mr-2"></i>
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent text-white placeholder-slate-400"
                        placeholder="Enter password"
                        autocomplete="new-password"
                    >
                </div>
                <div class="mb-6">
                    <label for="area" class="block text-sm font-medium text-slate-300 mb-2">
                        <i data-lucide="map" class="w-4 h-4 inline mr-2"></i>
                        Area
                    </label>
                    <select id="area" name="area" required class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-orange-500 text-white">
                        <option value="Aetheria">Aetheria</option>
                        <option value="Lumina">Lumina</option>
                        <option value="Drakoria">Drakoria</option>
                        <option value="Solstice">Solstice</option>
                        <option value="Virelia">Virelia</option>
                    </select>
                </div>
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-200 transform hover:scale-105"
                >
                    <i data-lucide="user-plus" class="w-4 h-4 inline mr-2"></i>
                    REGISTER
                </button>
                            </form>

            <!-- Back to Login -->
            <div class="text-center mt-6">
                <a href="/challenge/login" class="text-slate-400 hover:text-orange-400 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4 inline mr-2"></i>
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script src="/challenge/public/js/particles.js"></script>
</body>
</html>
